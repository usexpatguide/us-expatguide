  <div id="root"></div>
  <script>
    // ===== BOOT ERROR CATCHER =====
    // Captures any error that happens before React mounts (babel parse, script load, top-level code)
    // and shows it in the DOM so the page never goes fully blank.
    (function() {
      var bootErrors = [];
      window.__bootErrors = bootErrors;
      window.addEventListener('error', function(e) {
        var msg = e.message || String(e.error || 'Unknown error');
        var file = e.filename || '';
        var line = e.lineno || '?';
        var col = e.colno || '?';
        var stack = (e.error && e.error.stack) || '';
        bootErrors.push({ message: msg, file: file, line: line, col: col, stack: stack, time: new Date().toISOString() });
        renderBootError();
      });
      window.addEventListener('unhandledrejection', function(e) {
        var msg = 'Unhandled Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
        var stack = (e.reason && e.reason.stack) || '';
        bootErrors.push({ message: msg, file: '', line: '?', col: '?', stack: stack, time: new Date().toISOString() });
        renderBootError();
      });

      function renderBootError() {
        // Wait a beat — if React mounts and works, it'll replace #root. If not, we inject the error.
        setTimeout(function() {
          var root = document.getElementById('root');
          if (!root) return;
          // If root still has no child content 2s after first error, show the error panel.
          if (root.children.length > 0 && root.querySelector('[class*="navbar"], nav, .hero, section')) return;
          var html = '<div style="padding:24px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#fef2f2;color:#991b1b;min-height:100vh;box-sizing:border-box;">'
            + '<div style="max-width:720px;margin:0 auto;">'
            + '<h2 style="margin:0 0 8px;font-size:18px;">⚠ App failed to start</h2>'
            + '<p style="margin:0 0 16px;color:#7f1d1d;font-size:14px;">The application crashed during initialization. Details below for debugging.</p>'
            + bootErrors.map(function(err, i) {
                return '<div style="background:#fff;border:1px solid #fecaca;border-radius:8px;padding:12px;margin-bottom:10px;">'
                  + '<div style="font-weight:600;font-size:14px;margin-bottom:4px;">Error ' + (i+1) + ': ' + escapeHtml(err.message) + '</div>'
                  + (err.file ? '<div style="font-size:12px;color:#9a3412;margin-bottom:4px;">' + escapeHtml(err.file) + ':' + err.line + ':' + err.col + '</div>' : '')
                  + (err.stack ? '<pre style="font-size:11px;background:#fef3c7;color:#713f12;padding:8px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;margin:6px 0 0;max-height:200px;">' + escapeHtml(err.stack) + '</pre>' : '')
                  + '</div>';
              }).join('')
            + '<div style="font-size:12px;color:#9a3412;margin-top:12px;">Tip: open DevTools Console for the full stack trace. You can also inspect <code style="background:#fee2e2;padding:1px 4px;border-radius:3px;">window.__bootErrors</code>.</div>'
            + '</div></div>';
          root.innerHTML = html;
        }, 2000);
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function(c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]); });
      }
    })();
  </script>
